<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rendered state census fixture: late-fetch-overflow</title>
<style>
  html, body { margin: 0; font: 16px/1.4 sans-serif; }
  #storybook-root { padding: 16px; }
  button { min-width: 44px; min-height: 44px; font: inherit; }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); }
  .dialog { position: fixed; left: 16px; right: 16px; top: 48px; padding: 16px; background: #fff; border-radius: 8px; }
  .dialog h2 { margin: 0 0 8px; font-size: 18px; }
  .dialog .footer { margin-top: 16px; display: flex; gap: 8px; }
</style>
</head>
<body>
<!-- Task 923 Revision 6 self-test fixture "late-fetch-overflow". R31 (c), planted: on open the dialog fetches clean.html?__census_delay=1500 (the self-test server answers it 1500ms late) and, when the fetch ends, appends a 300px text block inside a 200px overflow:visible box. The page is not settled while a request to its own origin is in flight, so the block is there when the dialog is measured: fails component-overflow on the portal root. Without the in-flight condition the gate measures the dialog before the block exists and goes green. -->
<div id="storybook-root">
  <button id="open" type="button">Open dialog</button>
  <p>Fixture page, not a product Story.</p>
  
</div>
<script type="application/json" id="census-state">{"id":"fixture-late-fetch-overflow","story":"late-fetch-overflow","open":{"kind":"click","selector":"#open"},"portals":1,"focus":"trap","dismiss":["escape"],"trigger":"#open"}</script>
<script>
(function () {
  var portal = null;
  var opener = document.getElementById('open');
  if (!opener) return;
  function close() {
    if (!portal) return;
    portal.remove();
    portal = null;
    opener.focus();
  }
  function request() { close(); }
  function open() {
    if (portal) return;
    portal = document.createElement('div');
    portal.setAttribute('data-portal', 'true');
    portal.innerHTML = '<div class="backdrop"></div>' +
      '<div class="dialog" role="dialog" aria-modal="true">' +
      '<button type="button" data-census-close aria-label="Close" style="float:right">&times;</button>' +
      '<h2>Dialog title</h2><p>Short body text.</p>' + "<div id=\"late-box\" style=\"width:200px;overflow:visible\"></div>" +
      '<div class="footer"><button type="button">Save</button><button type="button">Cancel</button></div></div>';
    document.body.appendChild(portal);
    portal.querySelector('.backdrop').addEventListener('click', request);
    portal.querySelector('[data-census-close]').addEventListener('click', request);
    portal.querySelector('[data-census-close]').focus();
    fetch('clean.html?__census_delay=1500').then(function (r) { return r.text(); }).then(function () {
      var box = portal && portal.querySelector('#late-box');
      if (box) box.innerHTML = '<div style="width:300px">Late text block</div>';
    });
  }
  opener.addEventListener('click', open);
  document.addEventListener('keydown', function (e) {
    if (!portal) return;
    if (e.key === 'Escape') request();
    if (e.key === 'Tab') {
      var f = Array.prototype.slice.call(portal.querySelectorAll('button'));
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (!portal.contains(a)) { first.focus(); e.preventDefault(); }
      else if (e.shiftKey && a === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && a === last) { first.focus(); e.preventDefault(); }
    }
  });
})();
</script>
</body>
</html>
