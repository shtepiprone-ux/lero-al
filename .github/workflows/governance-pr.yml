{
  "name": "Governance Validation (PR)",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "merge_group": {
      "types": [
        "checks_requested"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "base_sha": {
          "description": "Full base SHA to validate",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "governance-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "env": {
    "GATES_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "GATES_HEAD_SHA": "${{ github.sha }}",
    "REVIEW_LEDGER_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "SURFACE_CENSUS_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "SURFACE_CENSUS_HEAD_SHA": "${{ github.sha }}",
    "UI_CONTRACT_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "UI_CONTRACT_HEAD_SHA": "${{ github.sha }}",
    "MOBILE_ADAPTATION_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "MOBILE_ADAPTATION_HEAD_SHA": "${{ github.sha }}",
    "KICKOFF_EVIDENCE_BASE_SHA": "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}",
    "KICKOFF_EVIDENCE_HEAD_SHA": "${{ github.sha }}"
  },
  "jobs": {
    "governance": {
      "name": "Governance Check",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Workflow gate regression tests",
          "run": "node scripts/workflow-gates/selftests.mjs"
        },
        {
          "name": "Inventory all rule and role documents",
          "run": "node scripts/workflow-gates/cli.mjs inventory"
        },
        {
          "name": "Review evidence",
          "run": "node scripts/workflow-gates/review-evidence.mjs"
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Run every registered static gate",
          "if": "${{ !cancelled() && steps.install.outcome == 'success' }}",
          "run": "node scripts/workflow-gates/run.mjs static"
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "static-governance",
            "path": "test-results/workflow-gates/",
            "retention-days": 14
          }
        }
      ]
    },
    "unit": {
      "name": "Unit and Component Tests",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Build compiled CSS required by existing regression tests",
          "run": "npm run build"
        },
        {
          "name": "Run complete regression suite without focused tests or retries",
          "run": "npm test -- --allowOnly=false --passWithNoTests=false --retry=0 --reporter=default --reporter=json --outputFile=test-results/unit.json"
        },
        {
          "name": "Validate nonempty unit collection and actual result",
          "run": "node scripts/workflow-gates/cli.mjs unit-report"
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "unit-results",
            "path": "test-results/unit.json",
            "retention-days": 14
          }
        }
      ]
    },
    "contracts": {
      "name": "Task Security Contracts",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Install Chromium for mapped browser boundaries",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Validate changed tasks, both security layers, executed cases and fresh evidence",
          "run": "node scripts/workflow-gates/cli.mjs diff --phase release",
          "env": {
            "NEXT_PUBLIC_SUPABASE_URL": "${{ secrets.SECURITY_CI_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY": "${{ secrets.SECURITY_CI_SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY": "${{ secrets.SECURITY_CI_SUPABASE_SERVICE_ROLE_KEY }}",
            "DATABASE_URL": "${{ secrets.SECURITY_CI_DATABASE_URL }}",
            "SUPABASE_CA_CERT": "${{ secrets.SECURITY_CI_SUPABASE_CA_CERT }}",
            "SECURITY_TEST_TARGET": "${{ vars.SECURITY_TEST_TARGET }}",
            "SECURITY_TEST_PROJECT_REF": "${{ vars.SECURITY_TEST_PROJECT_REF }}"
          }
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "security-contract-results",
            "path": "test-results/workflow-gates/",
            "retention-days": 14
          }
        }
      ],
      "environment": "security-ci"
    },
    "hooks": {
      "name": "Windows Hook Tests",
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "PowerShell 5.1 hook and recovery regressions",
          "run": "node scripts/workflow-gates/selftests.mjs"
        },
        {
          "name": "Existing phase hook negative and recovery tests",
          "shell": "powershell",
          "run": "& .\\.claude\\hooks\\phase-write-gate.ps1 -VerifyGate\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
        }
      ]
    },
    "storybook-build": {
      "name": "Storybook Build",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Build Storybook",
          "run": "npm run build-storybook"
        },
        {
          "name": "Retain Storybook for this run",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "storybook-build",
            "path": "storybook-static/",
            "retention-days": 1
          }
        }
      ]
    },
    "homepage-grid": {
      "name": "Homepage Grid Validation",
      "runs-on": "ubuntu-latest",
      "needs": [
        "storybook-build"
      ],
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Download Storybook",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "storybook-build",
            "path": "storybook-static"
          }
        },
        {
          "name": "Run every homepage gate and deliberate-break self-test",
          "run": "node scripts/workflow-gates/run.mjs homepage"
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "homepage-grid-results",
            "path": "test-results/workflow-gates/",
            "retention-days": 14
          }
        }
      ]
    },
    "locale-leak": {
      "name": "Locale Leak Detection (${{ matrix.shard }}/6)",
      "runs-on": "ubuntu-latest",
      "needs": [
        "storybook-build"
      ],
      "timeout-minutes": 25,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": [
            1,
            2,
            3,
            4,
            5,
            6
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Download Storybook",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "storybook-build",
            "path": "storybook-static"
          }
        },
        {
          "name": "Complete locale matrix; report leaks under the owner migration exception",
          "run": "node scripts/check-locale-leak.mjs --mantine-only --report-only-leaks --shard=${{ matrix.shard }}/6"
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "locale-leak-${{ matrix.shard }}",
            "path": ".screenshots/locale-leak/",
            "retention-days": 14
          }
        }
      ]
    },
    "click-shield": {
      "name": "Click-Shield Gate (blocking)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "environment": "security-ci",
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Install dependencies",
          "id": "install",
          "run": "npm ci"
        },
        {
          "name": "Verify required approved development service configuration",
          "run": "for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do\n  if [ -z \"${!name}\" ]; then echo \"::error::Missing protected security-ci secret: $name\"; exit 1; fi\ndone\nnode scripts/workflow-gates/cli.mjs target",
          "env": {
            "NEXT_PUBLIC_SUPABASE_URL": "${{ secrets.SECURITY_CI_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY": "${{ secrets.SECURITY_CI_SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY": "${{ secrets.SECURITY_CI_SUPABASE_SERVICE_ROLE_KEY }}",
            "CLICK_SHIELD_CI_FIXTURE": "1",
            "SECURITY_TEST_TARGET": "${{ vars.SECURITY_TEST_TARGET }}",
            "SECURITY_TEST_PROJECT_REF": "${{ vars.SECURITY_TEST_PROJECT_REF }}"
          }
        },
        {
          "name": "Install Chromium",
          "run": "npx playwright install chromium --with-deps"
        },
        {
          "name": "Build production bundle",
          "run": "npm run build",
          "env": {
            "NEXT_PUBLIC_SUPABASE_URL": "${{ secrets.SECURITY_CI_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY": "${{ secrets.SECURITY_CI_SUPABASE_ANON_KEY }}",
            "CLICK_SHIELD_CI_FIXTURE": "1"
          }
        },
        {
          "name": "CSS variable ownership and resolvability",
          "run": "npm run check:css-vars"
        },
        {
          "name": "Start local production server",
          "run": "nohup npm start > server.log 2>&1 &",
          "env": {
            "NEXT_PUBLIC_SUPABASE_URL": "${{ secrets.SECURITY_CI_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY": "${{ secrets.SECURITY_CI_SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY": "${{ secrets.SECURITY_CI_SUPABASE_SERVICE_ROLE_KEY }}",
            "CLICK_SHIELD_CI_FIXTURE": "1"
          }
        },
        {
          "name": "Wait for local server",
          "run": "for i in $(seq 1 30); do\n  if curl -sf -o /dev/null http://127.0.0.1:3000/; then exit 0; fi\n  sleep 2\ndone\ncat server.log\nexit 1"
        },
        {
          "name": "Check actual local interactions",
          "env": {
            "BASE_URL": "http://127.0.0.1:3000"
          },
          "run": "npm run check:click-shield"
        },
        {
          "name": "Upload evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "click-shield-report",
            "path": "server.log\ntest-results/",
            "retention-days": 14
          }
        }
      ]
    },
    "governance-required": {
      "name": "Governance Required",
      "runs-on": "ubuntu-latest",
      "if": "${{ always() }}",
      "needs": [
        "governance",
        "unit",
        "contracts",
        "hooks",
        "storybook-build",
        "homepage-grid",
        "locale-leak",
        "click-shield"
      ],
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Require success from every mandatory job",
          "env": {
            "GATES_NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "node scripts/workflow-gates/cli.mjs required"
        }
      ]
    },
    "release-security-required": {
      "name": "Release Security Required",
      "runs-on": "ubuntu-latest",
      "if": "${{ always() && github.event_name != 'pull_request' }}",
      "needs": [
        "governance-required"
      ],
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444",
          "with": {
            "cache": "npm",
            "node-version": "22.22.3"
          }
        },
        {
          "name": "Require green governance on this revision",
          "env": {
            "RESULT": "${{ needs.governance-required.result }}"
          },
          "run": "test \"$RESULT\" = success"
        },
        {
          "name": "Require resolution and reviewed regression evidence for known security findings",
          "run": "node scripts/workflow-gates/cli.mjs release"
        }
      ]
    }
  }
}
