name: Governance Validation (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'messages/**'
      - '.github/workflows/**'

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint (with governance rules)
        run: npm run lint

      - name: Gate unit tests (check-stories gate correctness)
        run: npm test

      - name: Auth lifecycle regression guard (Epic RS Slice 2)
        run: npm run test:auth

      - name: Listings lifecycle regression guard (Epic RS Slice 3)
        run: npm run test:listings

      - name: Admin lifecycle regression guard (Epic RS Slice 4)
        run: npm run test:admin

      - name: RLS write-path guard smoke (Epic RS Slice 5)
        run: npm run test:rls-guards

      - name: Admin data freshness regression guard (Epic KK)
        run: npm run test:admin-freshness

      - name: i18n/hydration regression guard (Epic RS Slice 6)
        run: npm run test:i18n-hydration

      - name: Static i18n parity gate (sq/en/uk/it key-set match)
        run: npm run check:i18n

      - name: Storybook governance gate
        run: npm run check:stories

      - name: Primitive governance scan
        run: npm run governance:primitives

      - name: SSR/Hydration governance scan
        run: npm run governance:ssr

      - name: Responsive governance scan
        run: npm run governance:responsive

      - name: Tailwind entropy scan
        run: npm run governance:tailwind

      - name: Localization governance scan
        run: npm run governance:localization

      - name: Static i18n hardcode gate (fail-on-new, baseline-diff)
        run: npm run check:i18n-hardcode

      - name: Dynamic i18n key gate (resolved-key coverage, fail-on-new)
        run: npm run check:i18n-dynamic

      - name: File integrity gate (NUL bytes, BOM, parse errors, truncation)
        run: npm run check:file-integrity:all

      - name: Mojibake / encoding artifact gate (UTF-8 double-encoding, U+FFFD)
        run: npm run check:mojibake

      - name: Story coverage gate (fail-on-new; exemption allowlist)
        run: npm run check:story-coverage

      - name: Design token strict gate (blocking — 0 unsuppressed raw values)
        run: npm run check:design-tokens:strict

      - name: Hydration gate self-test (verifies gate detects violations — CI-safe, no server needed)
        run: npm run check:hydration:verify

      - name: Admin hydration config self-test (verifies admin branch wiring — no server, no auth)
        run: npm run check:hydration:admin-config

      - name: listing_reports authenticated grant check (Task 460 / Epic BB)
        run: npm run check:listing-reports-grants

      - name: Listing public-visibility invariant gate (Epic LV / LV.4)
        run: npm run check:listing-visibility

      - name: Listing public-visibility gate self-test (verifies gate detects violations — CI-safe)
        run: npm run check:listing-visibility:verify

      - name: Full governance report (summary)
        if: always()
        run: npm run governance

  # ── Rendered proof and locale leak run as TWO INDEPENDENT jobs (no `needs`) ──
  # Previously both ran as sequential steps inside one 45-min job, so locale-leak
  # only got whatever budget rendered-proof left behind and was Cancelled on timeout
  # rather than producing an explicit PASS/FAIL. Split so each gets its own full
  # 45-min budget and runs in parallel. Both build Storybook independently (no shared
  # artifact between jobs). Full matrix stays blocking — no --fast, no reduced
  # stories/locales/viewports.

  rendered-proof:
    name: Rendered Proof (Mantine)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Storybook (runs check:stories pre-gate)
        run: npm run build-storybook

      - name: Homepage grid invariants gate (column steps, gaps, header geometry)
        run: npm run check:homepage-grid

      - name: Homepage grid invariants gate self-test (verifies gate detects violations — CI-safe)
        run: npm run check:homepage-grid:verify

      - name: Rendered-proof gate (Task 529 — Mantine/Primitives/* enforced, auto-discovered)
        # --mantine-only: blocks CI specifically on the Mantine/Primitives/* gate this task adds.
        # Deliberately does NOT also run the pre-existing ASSERT_STORIES/geometry-only phases here —
        # running the full assert surfaced pre-existing failures across unrelated admin stories
        # (AdminSidebar, AdminSupportManager, NotificationCenter, AdminReportsManager, etc.) that
        # predate this task and are out of its scope to fix; wiring the FULL gate in as blocking
        # would make every PR red for reasons unrelated to Mantine primitives. See the Task 529
        # session log for the full breakdown — that pre-existing gap is flagged as a separate
        # follow-up. Story/cell counts are printed by the run itself; do not hardcode them here.
        run: npm run screenshots:assert -- --mantine-only

      - name: Upload rendered-assert report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-assert-report
          path: .screenshots/rendered-assert/
          retention-days: 7

  locale-leak:
    name: Locale Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Storybook (runs check:stories pre-gate)
        run: npm run build-storybook

      - name: Locale leak detection (Task Q0R — Mantine/Primitives/* + Patterns/Mantine/* only, legacy excluded)
        # continue-on-error (Task 625, 2026-07-19): migration-window policy — the detector still runs and
        # reports, but does not block the PR while legacy→Mantine story migration is active and newly
        # migrated stories keep surfacing loanword/fixture leaks that would otherwise churn on every PR.
        # Revert to blocking once migration completes (owner directive). The script's own exit code and
        # check:locale-leak:mantine-only's definition are unchanged — only this CI job is non-blocking.
        continue-on-error: true
        run: npm run check:locale-leak:mantine-only

      - name: Upload leak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-leak-report
          path: .screenshots/locale-leak/
          retention-days: 7
