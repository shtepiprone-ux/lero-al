<style>

  #storybook-root { padding: 16px; }
  button { min-width: 44px; min-height: 44px; font: inherit; }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); }
  .dialog { position: fixed; left: 16px; right: 16px; top: 48px; padding: 16px; background: #fff; border-radius: 8px; }

<!-- Task 923 Revision 5 self-test fixture "trap-transient-body-focus". R26, benign: a modal dialog whose second button (Save), the first time it takes focus, is removed and inserted again 80ms later and focused, so the focus is on body for 80ms. Nobody who presses Tab meets a leak; the gate reads the settled focus and passes. -->
<div id="storybook-root">
  <button id="open" type="button">Open dialog</button>
  <p>Fixture page, not a product Story.</p>
  
</div>
<script type="application/json" id="census-state">{"id":"fixture-trap-transient-body-focus","story":"trap-transient-body-focus","open":{"kind":"click","selector":"#open"},"portals":1,"focus":"trap","dismiss":["escape","close-control","outside"],"trigger":"#open","closeSelector":"[data-census-close]"}</script>
<script>
(function () {
  var portal = null;
  var opener = document.getElementById('open');
  if (!opener) return;
  function close() {
    if (!portal) return;
    portal.remove();
    portal = null;
    opener.focus();
  }
  function open() {
    if (portal) return;
    portal = document.createElement('div');
    portal.setAttribute('data-portal', 'true');
    portal.innerHTML = '<div class="backdrop"></div>' +
      '<div class="dialog" role="dialog" aria-modal="true">' +
      '<button type="button" data-census-close aria-label="Close" style="float:right">&times;</button>' +
      '<h2>Dialog title</h2><p>Short body text.</p>' + "" +
      '<div class="footer"><button type="button">Save</button><button type="button">Cancel</button></div></div>';
    document.body.appendChild(portal);
    portal.querySelector('.backdrop').addEventListener('click', close);
    portal.querySelector('[data-census-close]').addEventListener('click', close);
    portal.querySelector('[data-census-close]').focus();
    var second = portal.querySelectorAll('button')[1];
    var used = false;
    second.addEventListener('focus', function () {
      if (used) return;
      used = true;
      var parent = second.parentNode;
      var next = second.nextSibling;
      second.remove();
      setTimeout(function () { parent.insertBefore(second, next); second.focus(); }, 80);
    });
  }
  opener.addEventListener('click', open);
  document.addEventListener('keydown', function (e) {
    if (!portal) return;
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') {
      var f = Array.prototype.slice.call(portal.querySelectorAll('button'));
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (!portal.contains(a)) { first.focus(); e.preventDefault(); }
      else if (e.shiftKey && a === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && a === last) { first.focus(); e.preventDefault(); }
    }
  });
})();
</script>
</body>
