name: Governance Validation (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'messages/**'
      - '.github/workflows/**'

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint (with governance rules)
        run: npm run lint

      - name: Gate unit tests (check-stories gate correctness)
        run: npm test

      - name: Auth lifecycle regression guard (Epic RS Slice 2)
        run: npm run test:auth

      - name: Listings lifecycle regression guard (Epic RS Slice 3)
        run: npm run test:listings

      - name: Admin lifecycle regression guard (Epic RS Slice 4)
        run: npm run test:admin

      - name: RLS write-path guard smoke (Epic RS Slice 5)
        run: npm run test:rls-guards

      - name: Admin data freshness regression guard (Epic KK)
        run: npm run test:admin-freshness

      - name: i18n/hydration regression guard (Epic RS Slice 6)
        run: npm run test:i18n-hydration

      - name: Static i18n parity gate (sq/en/uk/it key-set match)
        run: npm run check:i18n

      - name: Storybook governance gate
        run: npm run check:stories

      - name: Primitive governance scan
        run: npm run governance:primitives

      - name: SSR/Hydration governance scan
        run: npm run governance:ssr

      - name: Responsive governance scan
        run: npm run governance:responsive

      - name: Tailwind entropy scan
        run: npm run governance:tailwind

      - name: Localization governance scan
        run: npm run governance:localization

      - name: Static i18n hardcode gate (fail-on-new, baseline-diff)
        run: npm run check:i18n-hardcode

      - name: Dynamic i18n key gate (resolved-key coverage, fail-on-new)
        run: npm run check:i18n-dynamic

      - name: File integrity gate (NUL bytes, BOM, parse errors, truncation)
        run: npm run check:file-integrity:all

      - name: Mojibake / encoding artifact gate (UTF-8 double-encoding, U+FFFD)
        run: npm run check:mojibake

      - name: Story coverage gate (fail-on-new; exemption allowlist)
        run: npm run check:story-coverage

      - name: Design token strict gate (blocking — 0 unsuppressed raw values)
        run: npm run check:design-tokens:strict

      - name: Install Chromium for hydration self-test
        run: npx playwright install chromium --with-deps

      - name: Hydration gate self-test (verifies gate detects violations — CI-safe, no server needed)
        run: npm run check:hydration:verify

      - name: Admin hydration config self-test (verifies admin branch wiring — no server, no auth)
        run: npm run check:hydration:admin-config

      - name: listing_reports authenticated grant check (Task 460 / Epic BB)
        run: npm run check:listing-reports-grants

      - name: Listing public-visibility invariant gate (Epic LV / LV.4)
        run: npm run check:listing-visibility

      - name: Listing public-visibility gate self-test (verifies gate detects violations — CI-safe)
        run: npm run check:listing-visibility:verify

      - name: Full governance report (summary)
        if: always()
        run: npm run governance

  # ── Rendered proof, homepage-grid, and locale leak run as independent jobs (no `needs`) ──
  # Each job gets its own 45-minute GitHub Actions budget. The homepage-grid gate and
  # its self-test use Playwright extensively, so keeping them before rendered-proof
  # left the rendered-proof matrix insufficient time to complete. The three jobs build
  # Storybook independently (no shared artifact). The rendered-proof and homepage-grid
  # matrices stay blocking — no --fast, reduced stories, locales, or viewports.

  rendered-proof:
    name: Rendered Proof (Mantine)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Storybook (runs check:stories pre-gate)
        run: npm run build-storybook

      - name: Rendered-proof gate (Task 529 — Mantine/Primitives/* enforced, auto-discovered)
        # --mantine-only: blocks CI specifically on the Mantine/Primitives/* gate this task adds.
        # Deliberately does NOT also run the pre-existing ASSERT_STORIES/geometry-only phases here —
        # running the full assert surfaced pre-existing failures across unrelated admin stories
        # (AdminSidebar, AdminSupportManager, NotificationCenter, AdminReportsManager, etc.) that
        # predate this task and are out of its scope to fix; wiring the FULL gate in as blocking
        # would make every PR red for reasons unrelated to Mantine primitives. See the Task 529
        # session log for the full breakdown — that pre-existing gap is flagged as a separate
        # follow-up. Story/cell counts are printed by the run itself; do not hardcode them here.
        run: npm run screenshots:assert -- --mantine-only

      - name: Assertion-liveness meta-gate (Task 710 — a null-everywhere assertion is a dead gate, not a pass)
        # Reads the manifest.json the previous step just produced (default discovery: the latest
        # dir under .screenshots/rendered-assert/, which is exactly that run on a fresh checkout).
        # Fails on a NEW dead assertion, a STALE or ORPHAN registry entry, or a manifest with no
        # boolean-shaped assertion at all (Task 721); reports LIVE-THIN loudly without blocking.
        # Never launches a browser.
        run: npm run check:assertion-liveness

      - name: Assertion-liveness meta-gate self-test (Task 721 — the gate's own PLANTS harness, wired into CI so a broken arm cannot pass silently)
        # In-memory only (synthetic fixture manifests, no browser, no dependency on the previous
        # step's output) — sub-second, so wiring it costs effectively nothing. Proves DEAD-NEW,
        # STALE-ENTRY, ORPHAN-ENTRY, NO-BOOLEAN-ASSERTIONS, and BAD-INPUT all genuinely fail, LIVE-
        # THIN reports without blocking, and the real manifest from the previous step genuinely
        # passes. Without this step, a future edit could silently break any of the gate's five arms
        # and CI would never notice — the exact "stopped checking" failure this gate itself exists
        # to catch, one layer up.
        run: npm run check:assertion-liveness:verify

      - name: Upload rendered-assert report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-assert-report
          path: .screenshots/rendered-assert/
          retention-days: 7

  homepage-grid:
    name: Homepage Grid Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Storybook (runs check:stories pre-gate)
        run: npm run build-storybook

      - name: Homepage grid invariants gate (column steps, gaps, header geometry)
        run: npm run check:homepage-grid

      - name: Homepage grid invariants gate self-test (verifies gate detects violations — CI-safe)
        run: npm run check:homepage-grid:verify

  locale-leak:
    name: Locale Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Storybook (runs check:stories pre-gate)
        run: npm run build-storybook

      - name: Locale leak detection (Task Q0R — Mantine/Primitives/* + Patterns/Mantine/* only, legacy excluded)
        # continue-on-error (Task 625, 2026-07-19): migration-window policy — the detector still runs and
        # reports, but does not block the PR while legacy→Mantine story migration is active and newly
        # migrated stories keep surfacing loanword/fixture leaks that would otherwise churn on every PR.
        # Revert to blocking once migration completes (owner directive). The script's own exit code and
        # check:locale-leak:mantine-only's definition are unchanged — only this CI job is non-blocking.
        continue-on-error: true
        run: npm run check:locale-leak:mantine-only

      - name: Upload leak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-leak-report
          path: .screenshots/locale-leak/
          retention-days: 7

  click-shield:
    name: Click-Shield Gate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Task 727 (Sprint 52, closing task) — owner decision 2026-08-09, quoted verbatim in the
    # kickoff (tasks/Sprints/Sprint_52_kickoff_prompt_Task_727_ClickShield_CI_And_Contextual_N6.md
    # §3.1): "CI запускає gate на локальному production build і він blocking. Не на production
    # URL. У PR CI: npm ci → Playwright Chromium → npm run build → npm start → wait-for-ready →
    # check:click-shield. Команда має йти з BASE_URL=http://127.0.0.1:3000, без continue-on-error;
    # ненульовий exit code блокує merge." No prior job in this file builds/starts the real Next.js
    # app (all four existing jobs use build-storybook) — this is new infrastructure, not a copy of
    # an existing job.
    #
    # ⚠️ KNOWN PRECONDITION, not yet satisfied as of this task (session log,
    # docs/sessions/2026-08-09-task727-click-shield-ci-and-contextual-n6.md): `npm start` boots
    # cleanly with NO Supabase env vars, but every request 500s at runtime ("Your project's URL
    # and Key are required to create a Supabase client!", thrown from middleware on every route,
    # verified empirically by removing .env.local and hitting a fresh `next start`). No workflow
    # in this repository currently references any Supabase secret (grep across .github/workflows/
    # confirms zero hits), and `.env.local` is gitignored/untracked, so a fresh checkout has none
    # of these values. Until NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY exist as
    # repository secrets (owner action — outside git, cannot be done from this task's write set),
    # this job will build successfully and then fail at the wait-for-ready step (every route
    # 500s). Wired below by name so it starts working the moment those secrets are added.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        # Backgrounded within the job's persistent shell so it stays alive into the next step
        # (GitHub Actions runs every step's shell in the same process/session on the same runner).
        # Logged to a file rather than left attached to the step's own stdout, which closes when
        # the step returns.
        run: nohup npm start > server.log 2>&1 &

      - name: Wait for server readiness
        # A real readiness probe (repeated HTTP check), not a fixed sleep (Task 727 §7.3) — a
        # fixed sleep is exactly the kind of flakiness source that gets a blocking gate disabled.
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready within 60s" >&2
          cat server.log
          exit 1

      - name: Click-shield gate (blocking — base route, Drawer, and Modal scenarios, no continue-on-error)
        env:
          BASE_URL: http://127.0.0.1:3000
        # Redirected to a file (as its own statement, per this project's evidence-capture rule —
        # never trust a piped command's exit code) so the gate's own transcript survives as an
        # artifact independent of the ephemeral job log; the shell's real exit code still fails
        # the step because it is not piped through anything.
        run: |
          npm run check:click-shield > click-shield.log 2>&1
          exit_code=$?
          cat click-shield.log
          exit $exit_code

      - name: Upload click-shield evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: click-shield-report
          path: |
            click-shield.log
            server.log
          retention-days: 7
