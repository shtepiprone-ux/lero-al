# OpenSSF Scorecard (governance reset 2026-11-06). OWASP basis: CI/CD Security and Software Supply Chain Security —
# measure the repository's own supply-chain posture (branch protection, pinned actions, token permissions, dependency
# updates, SAST, signed releases) and show the findings in GitHub code scanning. Kept apart from ci.yml because
# publishing needs an OIDC token that no other job should hold.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
