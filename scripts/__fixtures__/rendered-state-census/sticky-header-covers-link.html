<header>Page header</header>

  <p style="margin:0"><a href="#target" style="display:inline-block;min-width:44px;min-height:44px">A link under the header</a></p>

<script type="application/json" id="census-state">{"id":"fixture-sticky-header-covers-link","story":"sticky-header-covers-link","open":{"kind":"click","selector":"#open"},"portals":1,"focus":"trigger","dismiss":["escape","outside"],"trigger":"#open"}</script>
<script>
(function () {
  var portal = null;
  var opener = document.getElementById('open');
  function close() { if (!portal) return; portal.remove(); portal = null; }
  function open() {
    if (portal) return;
    portal = document.createElement('div');
    portal.setAttribute('data-portal', 'true');
    portal.innerHTML = '<div class="mantine-Drawer-content" style="display:none"><p>navigation</p></div>' +
      '<div class="popover" role="note"><p>About this series: a short explanation.</p></div>';
    document.body.appendChild(portal);
  }
  window.scrollTo(0, 420);
  opener.addEventListener('click', open);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('mousedown', function (e) { if (portal && !portal.contains(e.target) && e.target !== opener) close(); });
})();
</script>
</body>
