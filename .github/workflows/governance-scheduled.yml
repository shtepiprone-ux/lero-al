name: Scheduled Governance Scan

on:
  # Weekly scan — every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: false
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly

# Read-only (2026-10-07): the report is published as a workflow artifact and the run summary, never
# committed. The former bot commit to main made the owner's local main diverge every Monday.
permissions:
  contents: read

jobs:
  weekly-governance-scan:
    name: Weekly Governance Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Governance gate self-test (planted violations must still fail)
        run: npm run governance:verify

      - name: Run full governance scan with report
        id: governance
        run: |
          npm run governance:report || echo "GOVERNANCE_FAILED=true" >> $GITHUB_ENV
        continue-on-error: true

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report-${{ github.run_id }}
          path: docs/governance-reports/weekly/
          if-no-files-found: warn
          retention-days: 90

      - name: Post summary to workflow
        if: always()
        run: |
          echo "## Governance Scan Results" >> $GITHUB_STEP_SUMMARY
          TODAY=$(date +%Y-%m-%d)
          REPORT_PATH="docs/governance-reports/weekly/weekly-${TODAY}.md"
          if [ -f "$REPORT_PATH" ]; then
            cat "$REPORT_PATH" >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if governance violations found
        if: env.GOVERNANCE_FAILED == 'true'
        run: |
          echo "❌ Governance scan found new HIGH/CRITICAL findings or a stale baseline."
          echo "   Review the report artifact / run summary and fix them."
          exit 1
